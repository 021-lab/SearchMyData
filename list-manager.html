<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Список</title>
<script>
  const previewLocation = new URL(window.location.href);
  const previewHashVersion = previewLocation.hash.startsWith('#v=') ? previewLocation.hash.slice(3) : '';
  const previewVersion = previewLocation.searchParams.get('v') || previewHashVersion || 'dev';
  const cssLink = document.createElement('link');
  cssLink.rel = 'stylesheet';
  cssLink.href = `./list-manager.css?v=${encodeURIComponent(previewVersion)}`;
  document.head.appendChild(cssLink);
</script>
</head>
<body>
<div id="app-root" data-view-mode="list">
  <header>
    <button id="undo-btn" disabled title="Отменить последнее перетаскивание">↩</button>
    <h1>Мой список</h1>
    <button id="view-toggle-btn" title="Переключить вид">Журнал</button>
  </header>

  <div id="list-container"></div>

  <section id="action-log-panel" hidden>
    <div class="action-log-header">
      <h2>Журнал действий</h2>
    </div>
    <div id="action-log-list"></div>
  </section>

  <div class="toast" id="toast"></div>
  <button class="add-btn" id="add-btn" aria-label="Добавить задачу">+</button>

  <div id="tag-panel"></div>

  <div id="drop-zone-panel">
    <div class="panel-item" data-action="nest" style="background:#34c759"><span class="panel-icon">➕</span><span class="panel-label">Вложенный</span></div>
    <div class="panel-item" data-action="view" style="background:#5ac8fa"><span class="panel-icon">👁</span><span class="panel-label">Просмотр</span></div>
    <div class="panel-item" data-action="edit" style="background:#007aff"><span class="panel-icon">✏️</span><span class="panel-label">Изменить</span></div>
    <div class="panel-item" data-action="delete" style="background:#ff3b30"><span class="panel-icon">🗑</span><span class="panel-label">Удалить</span></div>
    <div class="panel-item" data-action="Open" style="background:#007aff"><span class="panel-icon">◯</span><span class="panel-label">Open</span></div>
    <div class="panel-item" data-action="Done" style="background:#34c759"><span class="panel-icon">✓</span><span class="panel-label">Done</span></div>
    <div class="panel-item" data-action="Focus" style="background:#ff9500"><span class="panel-icon">◎</span><span class="panel-label">Focus</span></div>
    <div class="panel-item" data-action="Archive" style="background:#8e8e93"><span class="panel-icon">▣</span><span class="panel-label">Archive</span></div>
    <div class="panel-item" data-action="Pause" style="background:#5856d6"><span class="panel-icon">Ⅱ</span><span class="panel-label">Pause</span></div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">Новый элемент</h2>
      <div id="modal-view-content" style="display:none; margin-bottom:12px;">
        <div id="view-line1" style="font-size:17px; font-weight:600; color:#1a1a2e; margin-bottom:5px;"></div>
        <div id="view-line2" style="font-size:14px; color:#888; margin-bottom:8px;"></div>
        <div id="view-tags" class="item-tags"></div>
      </div>
      <input type="text" id="input-line1" placeholder="Название (обязательно)" maxlength="60">
      <input type="text" id="input-line2" placeholder="Подпись (необязательно)" maxlength="80">
      <div class="modal-actions">
        <button class="btn btn-cancel" id="btn-cancel">Отмена</button>
        <button class="btn btn-add" id="btn-confirm">Добавить</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  const locationUrl = new URL(window.location.href);
  const hashVersion = locationUrl.hash.startsWith('#v=') ? locationUrl.hash.slice(3) : '';
  const version = locationUrl.searchParams.get('v') || hashVersion || 'dev';
  const load = (modulePath) => import(`${modulePath}?v=${encodeURIComponent(version)}`);

  const [
    { seedState },
    { createStore },
    { createInterpreter },
    { createRenderer },
    { createUI },
    { createBackendAdapter },
    { createSync },
    { createApp }
  ] = await Promise.all([
    load('./list-data.js'),
    load('./src/list-store.js'),
    load('./src/list-interpreter.js'),
    load('./src/list-renderer.js'),
    load('./src/list-ui.js'),
    load('./src/list-backend-adapter.js'),
    load('./src/list-sync.js'),
    load('./src/list-app.js')
  ]);

  const store = createStore({
    storageKey: 'searchmydata.list-interface.state',
    storage: window.localStorage,
    seedState
  });

  let app = null;
  const ui = createUI({
    rootPanel: document.getElementById('app-root'),
    header: document.querySelector('header'),
    viewToggleButton: document.getElementById('view-toggle-btn'),
    undoButton: document.getElementById('undo-btn'),
    addButton: document.getElementById('add-btn'),
    container: document.getElementById('list-container'),
    toastEl: document.getElementById('toast'),
    dropPanel: document.getElementById('drop-zone-panel'),
    tagPanel: document.getElementById('tag-panel'),
    overlay: document.getElementById('modal-overlay'),
    input1: document.getElementById('input-line1'),
    input2: document.getElementById('input-line2'),
    modalTitle: document.getElementById('modal-title'),
    btnConfirm: document.getElementById('btn-confirm'),
    btnCancel: document.getElementById('btn-cancel'),
    viewContent: document.getElementById('modal-view-content'),
    viewLine1: document.getElementById('view-line1'),
    viewLine2: document.getElementById('view-line2'),
    viewTagsEl: document.getElementById('view-tags'),
    actionLogPanel: document.getElementById('action-log-panel')
  });

  const renderer = createRenderer({
    rootPanel: document.getElementById('app-root'),
    container: document.getElementById('list-container'),
    actionLogPanel: document.getElementById('action-log-panel'),
    actionLogList: document.getElementById('action-log-list'),
    bindRow: ui.bindRow,
    onRendered: ui.onRendered
  });

  const adapter = createBackendAdapter();
  let sync = null;

  app = createApp({
    adapter,
    interpreter: createInterpreter(),
    renderer,
    store,
    sync: {
      enqueue(state, actionLogEntry) {
        return sync.enqueue(state, actionLogEntry);
      }
    },
    ui
  });

  sync = createSync({
    adapter,
    store,
    onStateChange(nextState) {
      app.onSyncedState(nextState);
    }
  });

  await app.init();
</script>
</body>
</html>
