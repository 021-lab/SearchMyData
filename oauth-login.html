<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход в аккаунт</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    text-align: center;
  }

  .logo {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 16px;
    margin: 0 auto 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }

  h1 { font-size: 24px; font-weight: 600; color: #1d1d1f; margin-bottom: 8px; }
  .subtitle { font-size: 15px; color: #6e6e73; margin-bottom: 36px; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; padding: 14px 20px;
    border-radius: 12px; border: 1.5px solid #e0e0e0;
    background: #fff; font-size: 15px; font-weight: 500; color: #1d1d1f;
    cursor: pointer; transition: all 0.15s; margin-bottom: 12px;
  }
  .btn:hover { background: #f5f5f7; border-color: #c8c8cc; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.45; cursor: default; transform: none; box-shadow: none; }

  .btn-apple { background: #000; border-color: #000; color: #fff; }
  .btn-apple:hover { background: #1d1d1f; border-color: #1d1d1f; }

  #status {
    display: none; margin-top: 16px; padding: 12px 16px;
    border-radius: 10px; font-size: 13px; text-align: left; line-height: 1.5;
  }
  #status.error { display: block; background: #fff2f2; border: 1px solid #ffd0d0; color: #c41e3a; }
  #status.info  { display: block; background: #f0f8ff; border: 1px solid #b3d9f7; color: #0071e3; }

  /* Profile card */
  #profile { display: none; margin-top: 28px; }
  #profile.visible { display: block; }

  .profile-box { background: #f5f5f7; border-radius: 14px; padding: 20px; text-align: left; }
  .profile-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }

  .avatar {
    width: 54px; height: 54px; border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
  }
  .avatar-initials {
    width: 54px; height: 54px; border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; font-size: 22px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  .profile-name  { font-size: 17px; font-weight: 600; color: #1d1d1f; }
  .profile-email { font-size: 13px; color: #6e6e73; margin-top: 3px; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 500; color: #1a7f37;
    background: #d4f4e2; padding: 4px 10px; border-radius: 20px;
  }

  .logout-btn {
    display: block; margin-top: 14px;
    background: none; border: none; color: #0071e3;
    font-size: 13px; cursor: pointer; padding: 0;
  }
  .logout-btn:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🔐</div>
  <h1>Войти в аккаунт</h1>
  <p class="subtitle">Выбери способ входа</p>

  <div id="login-section">
    <button class="btn" id="btn-google" onclick="signInGoogle()">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Войти через Google
    </button>

    <button class="btn btn-apple" onclick="signInApple()">
      <svg width="20" height="20" viewBox="0 0 814 1000" fill="white">
        <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105.3-44.8-150.3-109.8c-52.1-75.1-93.6-194.3-93.6-308.3 0-180.5 117.8-275.8 233.8-275.8 77.8 0 142.5 51.4 190.5 51.4 45.8 0 118.2-54.4 207.7-54.4zm-162-134c30.7-34.5 52.4-82.7 52.4-130.7 0-6.7-.6-13.4-1.9-19.4-49.1 1.9-108.2 31.4-143.5 71.9-26.3 29.4-51.4 77-51.4 125.6 0 7.1 1.3 14.1 1.9 16.4 3.2.6 8.4 1.3 13.4 1.3 44.5 0 100.4-29.4 129.1-64.8z"/>
      </svg>
      Войти через Apple
    </button>
  </div>

  <div id="status"></div>

  <div id="profile">
    <div class="profile-box">
      <div class="profile-row">
        <div id="avatar-wrap"></div>
        <div>
          <div class="profile-name"  id="p-name"></div>
          <div class="profile-email" id="p-email"></div>
        </div>
      </div>
      <span class="badge" id="p-badge">✓ Google</span>
    </div>
    <button class="logout-btn" onclick="logout()">Выйти из аккаунта</button>
  </div>
</div>

<script>
const CLIENT_ID = '327195172491-vq747ap3g0v3i8s9to4q71o8ft6vearj.apps.googleusercontent.com';

let tokenClient = null;

// ── UI helpers ────────────────────────────────────────────────────────────────
function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = type;
}
function clearStatus() {
  const el = document.getElementById('status');
  el.textContent = ''; el.className = '';
}

function showProfile(name, email, picture, provider) {
  document.getElementById('p-name').textContent  = name;
  document.getElementById('p-email').textContent = email;
  document.getElementById('p-badge').textContent = '✓ ' + provider;

  const wrap = document.getElementById('avatar-wrap');
  wrap.innerHTML = picture
    ? `<img class="avatar" src="${picture}" alt="${name}">`
    : `<div class="avatar-initials">${name[0].toUpperCase()}</div>`;

  document.getElementById('profile').classList.add('visible');
  document.getElementById('login-section').style.display = 'none';
  clearStatus();
}

function logout() {
  if (window.google?.accounts?.id) google.accounts.id.disableAutoSelect();
  document.getElementById('profile').classList.remove('visible');
  document.getElementById('login-section').style.display = 'block';
}

// ── Google Sign-In (GIS, popup, no backend) ───────────────────────────────────
function onGoogleLoad() {
  // One Tap / ID token flow → credential JWT returned directly to callback
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: onIdToken,
    ux_mode: 'popup',
    cancel_on_tap_outside: false,
  });

  // Token flow fallback (access token → userinfo API)
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: 'openid profile email',
    callback: onAccessToken,
    error_callback: (err) => showStatus('OAuth ошибка: ' + err.type, 'error'),
  });
}

function signInGoogle() {
  clearStatus();
  // Try One Tap first; if it's suppressed, fall back to token popup
  google.accounts.id.prompt((note) => {
    if (note.isNotDisplayed() || note.isSkippedMoment()) {
      tokenClient.requestAccessToken({ prompt: 'select_account' });
    }
  });
}

// ID-token flow: decode JWT payload directly (no server needed)
function onIdToken(resp) {
  try {
    const payload = JSON.parse(atob(resp.credential.split('.')[1]));
    showProfile(payload.name, payload.email, payload.picture, 'Google');
  } catch(e) {
    showStatus('Ошибка декодирования токена: ' + e.message, 'error');
  }
}

// Access-token flow: call Google userinfo endpoint
function onAccessToken(resp) {
  if (resp.error) { showStatus('Ошибка: ' + resp.error, 'error'); return; }
  fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
    headers: { Authorization: 'Bearer ' + resp.access_token }
  })
  .then(r => r.json())
  .then(u => showProfile(u.name, u.email, u.picture, 'Google'))
  .catch(e => showStatus('Не удалось получить профиль: ' + e.message, 'error'));
}

// ── Apple Sign-In (требует Apple Developer + домен верификацию) ───────────────
function signInApple() {
  showStatus('Apple Sign In требует Apple Developer Account и верификацию домена. Используй Google.', 'info');
}
</script>

<script src="https://accounts.google.com/gsi/client"
        onload="onGoogleLoad()"
        onerror="showStatus('Не удалось загрузить Google SDK','error')"
        async defer></script>
</body>
</html>
