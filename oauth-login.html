<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход в аккаунт</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    text-align: center;
  }

  .logo {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 16px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }

  h1 { font-size: 24px; font-weight: 600; color: #1d1d1f; margin-bottom: 8px; }
  .subtitle { font-size: 15px; color: #6e6e73; margin-bottom: 36px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 14px 20px;
    border-radius: 12px;
    border: 1.5px solid #e0e0e0;
    background: #fff;
    font-size: 15px;
    font-weight: 500;
    color: #1d1d1f;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 12px;
  }
  .btn:hover { background: #f5f5f7; border-color: #c8c8cc; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: default; transform: none; }

  .btn-apple { background: #000; border-color: #000; color: #fff; }
  .btn-apple:hover { background: #1d1d1f; border-color: #1d1d1f; }

  #status {
    display: none;
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    text-align: left;
    line-height: 1.5;
  }
  #status.error { display: block; background: #fff2f2; border: 1px solid #ffd0d0; color: #c41e3a; }
  #status.info  { display: block; background: #f0f8ff; border: 1px solid #b3d9f7; color: #0071e3; }
  #status.ok    { display: block; background: #f0fff4; border: 1px solid #b3f0c8; color: #1a7f37; }

  .spinner {
    display: none;
    width: 22px; height: 22px;
    border: 2px solid #e0e0e0;
    border-top-color: #667eea;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 16px auto 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Profile */
  #profile { display: none; margin-top: 28px; }
  #profile.visible { display: block; }

  .profile-box {
    background: #f5f5f7;
    border-radius: 14px;
    padding: 20px;
    text-align: left;
  }
  .profile-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }

  #profile-img {
    width: 54px; height: 54px;
    border-radius: 50%;
    object-fit: cover;
    background: #e0e0e0;
  }
  .profile-initials {
    width: 54px; height: 54px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-size: 22px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  #profile-name  { font-size: 17px; font-weight: 600; color: #1d1d1f; }
  #profile-email { font-size: 13px; color: #6e6e73; margin-top: 3px; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 500; color: #1a7f37;
    background: #d4f4e2; padding: 4px 10px; border-radius: 20px;
  }

  .logout-btn {
    display: block; margin-top: 14px;
    background: none; border: none;
    color: #0071e3; font-size: 13px; cursor: pointer;
    padding: 0;
  }
  .logout-btn:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🔐</div>
  <h1>Войти в аккаунт</h1>
  <p class="subtitle">Выбери способ входа</p>

  <div id="login-section">
    <!-- Google -->
    <button class="btn" id="btn-google" onclick="signIn('google')">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Войти через Google
    </button>

    <!-- Apple -->
    <button class="btn btn-apple" id="btn-apple" onclick="signIn('apple')">
      <svg width="20" height="20" viewBox="0 0 814 1000" fill="white">
        <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105.3-44.8-150.3-109.8c-52.1-75.1-93.6-194.3-93.6-308.3 0-180.5 117.8-275.8 233.8-275.8 77.8 0 142.5 51.4 190.5 51.4 45.8 0 118.2-54.4 207.7-54.4zm-162-134c30.7-34.5 52.4-82.7 52.4-130.7 0-6.7-.6-13.4-1.9-19.4-49.1 1.9-108.2 31.4-143.5 71.9-26.3 29.4-51.4 77-51.4 125.6 0 7.1 1.3 14.1 1.9 16.4 3.2.6 8.4 1.3 13.4 1.3 44.5 0 100.4-29.4 129.1-64.8z"/>
      </svg>
      Войти через Apple
    </button>
  </div>

  <div id="status"></div>
  <div class="spinner" id="spinner"></div>

  <!-- Profile (shown after login) -->
  <div id="profile">
    <div class="profile-box">
      <div class="profile-row">
        <div id="profile-img-wrap"></div>
        <div>
          <div id="profile-name"></div>
          <div id="profile-email"></div>
        </div>
      </div>
      <span class="badge" id="provider-badge">✓ Google</span>
    </div>
    <button class="logout-btn" onclick="doLogout()">Выйти из аккаунта</button>
  </div>
</div>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────
const PUBLISHABLE_KEY = 'pk_test_bm9ybWFsLWphdmVsaW4tOTYuY2xlcmsuYWNjb3VudHMuZGV2JA';

// The page URL that Clerk should redirect back to after OAuth.
// We use the current href so it works on any hosting (htmlpreview, localhost, etc.)
const PAGE_URL = window.location.href.split('#')[0];

let clerk = null;
let currentProvider = 'Google';

// ─── Helpers ──────────────────────────────────────────────────────────────────
function showStatus(msg, type = 'error') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = type;
}
function clearStatus() {
  const el = document.getElementById('status');
  el.textContent = '';
  el.className = '';
}
function setLoading(on) {
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
  ['btn-google', 'btn-apple'].forEach(id => {
    document.getElementById(id).disabled = on;
  });
}

function showProfile(user, provider) {
  const name  = user.fullName || [user.firstName, user.lastName].filter(Boolean).join(' ') || 'Пользователь';
  const email = user.primaryEmailAddress?.emailAddress || '';
  const img   = user.imageUrl || '';

  document.getElementById('profile-name').textContent  = name;
  document.getElementById('profile-email').textContent = email;
  document.getElementById('provider-badge').textContent = '✓ ' + provider;

  const wrap = document.getElementById('profile-img-wrap');
  if (img) {
    wrap.innerHTML = `<img id="profile-img" src="${img}" alt="${name}">`;
  } else {
    wrap.innerHTML = `<div class="profile-initials">${name[0].toUpperCase()}</div>`;
  }

  document.getElementById('profile').classList.add('visible');
  document.getElementById('login-section').style.display = 'none';
  clearStatus();
  setLoading(false);
}

// ─── Clerk init ───────────────────────────────────────────────────────────────
async function initClerk() {
  try {
    clerk = new window.Clerk(PUBLISHABLE_KEY);
    await clerk.load();

    // Detect OAuth callback (Clerk adds __clerk_status or __clerk_db_jwt to URL)
    const search = window.location.search;
    const hash   = window.location.hash;
    const isCallback = search.includes('__clerk') || hash.includes('__clerk')
                    || search.includes('code=') || search.includes('sso');

    if (isCallback) {
      setLoading(true);
      showStatus('Завершаем вход…', 'info');
      try {
        await clerk.handleRedirectCallback({
          afterSignInUrl:  PAGE_URL,
          afterSignUpUrl:  PAGE_URL,
        });
      } catch (cbErr) {
        // handleRedirectCallback may throw if not on a callback URL; that's fine
        console.warn('handleRedirectCallback:', cbErr.message);
      }
      setLoading(false);
      clearStatus();
    }

    // Show profile if already signed in
    if (clerk.user) {
      showProfile(clerk.user, currentProvider);
    }

  } catch (err) {
    showStatus('Ошибка загрузки Clerk: ' + err.message);
  }
}

// ─── Sign in ──────────────────────────────────────────────────────────────────
async function signIn(provider) {
  if (!clerk) { showStatus('SDK ещё загружается, попробуй снова через секунду.'); return; }
  clearStatus();
  setLoading(true);
  currentProvider = provider === 'google' ? 'Google' : 'Apple';

  const strategy = provider === 'google' ? 'oauth_google' : 'oauth_apple';

  try {
    await clerk.client.signIn.authenticateWithRedirect({
      strategy,
      redirectUrl:         PAGE_URL,   // Clerk redirects here after OAuth
      redirectUrlComplete: PAGE_URL,   // final destination after session established
    });
    // Page will redirect — nothing more to do here
  } catch (err) {
    setLoading(false);
    showStatus('OAuth ошибка: ' + err.message);
  }
}

// ─── Logout ───────────────────────────────────────────────────────────────────
async function doLogout() {
  if (clerk) await clerk.signOut();
  document.getElementById('profile').classList.remove('visible');
  document.getElementById('login-section').style.display = 'block';
  clearStatus();
}
</script>

<!-- Clerk JS SDK -->
<script
  src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
  crossorigin="anonymous"
  onload="initClerk()"
  onerror="document.getElementById('status').textContent='Не удалось загрузить SDK'; document.getElementById('status').className='error';">
</script>

</body>
</html>
