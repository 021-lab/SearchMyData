name: Deploy to Railway

on:
  push:
    branches: [claude/gitasbackend-worktree-mVUTB, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Debug - check Railway API access
        run: |
          echo "Our runner IP:"
          curl -s https://checkip.amazonaws.com || true
          echo ""
          echo "Testing Railway API:"
          RESP=$(curl -s --max-time 10 -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer rlwy_oacs_c7045a85b9289fc2d769f26dd030bb637a10546b" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ me { name email } }"}')
          echo "Response: $RESP"
          if echo "$RESP" | grep -q "name"; then
            echo "RAILWAY_API=ACCESSIBLE"
          else
            echo "RAILWAY_API=BLOCKED"
          fi

      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli@latest
          railway --version

      - name: Verify Railway auth
        run: |
          export RAILWAY_TOKEN=rlwy_oacs_c7045a85b9289fc2d769f26dd030bb637a10546b
          railway whoami --json || echo "AUTH_FAILED"

      - name: Deploy
        run: |
          export RAILWAY_TOKEN=rlwy_oacs_c7045a85b9289fc2d769f26dd030bb637a10546b
          railway init --name SearchMyData || true
          railway status --json || true
          railway up --ci -m "Deploy SearchMyData" || echo "DEPLOY_FAILED"

      - name: Get domain
        id: domain
        run: |
          export RAILWAY_TOKEN=rlwy_oacs_c7045a85b9289fc2d769f26dd030bb637a10546b
          RESP=$(railway domain --generate --json 2>/dev/null || railway domain --json 2>/dev/null || echo "{}")
          echo "Domain resp: $RESP"
          DOMAIN=$(echo "$RESP" | python3 -c "
          import sys,json
          try:
              d=json.load(sys.stdin)
              items=d if isinstance(d,list) else [d]
              for i in items:
                  if i.get('domain'): print(i['domain']); break
          except: pass
          " || true)
          if [ -n "$DOMAIN" ]; then
            URL="https://$DOMAIN/list-manager.html"
            echo "url=$URL" >> $GITHUB_OUTPUT
            echo "DEPLOYED: $URL"
          fi

      - name: Write URL to repo
        run: |
          URL="${{ steps.domain.outputs.url }}"
          if [ -n "$URL" ]; then
            echo "$URL" > DEPLOYMENT_URL.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add DEPLOYMENT_URL.txt
            git commit -m "chore: deployment URL [skip ci]" || true
            git push origin claude/gitasbackend-worktree-mVUTB || true
          else
            echo "No URL to save"
          fi
