name: Deploy to Railway

on:
  push:
    branches: [claude/gitasbackend-worktree-mVUTB, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Create or find Railway project + Deploy
        env:
          RAILWAY_TOKEN: rlwy_oacs_c7045a85b9289fc2d769f26dd030bb637a10546b
        run: |
          set -e

          echo "=== Auth check ==="
          railway whoami --json

          echo "=== Finding or creating project ==="
          PROJECTS=$(railway project list --json 2>/dev/null || echo "[]")
          echo "Projects: $PROJECTS"

          PROJECT_ID=$(echo "$PROJECTS" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              if isinstance(data, list):
                  projects = data
              else:
                  projects = data.get('projects', [])
              match = [p for p in projects if p.get('name') == 'SearchMyData']
              print(match[0]['id'] if match else '')
          except:
              print('')
          " 2>/dev/null || echo "")

          if [ -n "$PROJECT_ID" ]; then
            echo "Found existing project: $PROJECT_ID"
            railway link --project "$PROJECT_ID"
          else
            echo "Creating new project SearchMyData..."
            railway init --name SearchMyData
          fi

          echo "=== Creating service if needed ==="
          SERVICES=$(railway service list --json 2>/dev/null || echo "[]")
          echo "Services: $SERVICES"
          SERVICE_COUNT=$(echo "$SERVICES" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              services = data if isinstance(data, list) else data.get('services', [])
              print(len(services))
          except:
              print('0')
          " 2>/dev/null || echo "0")

          if [ "$SERVICE_COUNT" = "0" ]; then
            echo "Creating web service..."
            railway add --service web 2>/dev/null || true
          fi

          echo "=== Deploying ==="
          railway up --ci -m "Deploy SearchMyData"

          echo "=== Generating domain ==="
          DOMAIN=$(railway domain --generate --json 2>/dev/null | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              domains = data if isinstance(data, list) else [data]
              print(next((d.get('domain','') for d in domains if d.get('domain')), ''))
          except:
              print('')
          " 2>/dev/null || echo "")

          if [ -z "$DOMAIN" ]; then
            DOMAIN=$(railway domain --json 2>/dev/null | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              domains = data if isinstance(data, list) else [data]
              print(next((d.get('domain','') for d in domains if d.get('domain')), ''))
          except:
              print('')
            " 2>/dev/null || echo "")
          fi

          echo ""
          echo "========================================"
          echo "  DEPLOYMENT COMPLETE!"
          if [ -n "$DOMAIN" ]; then
            echo "  URL: https://$DOMAIN/list-manager.html"
          else
            echo "  Check Railway dashboard for domain."
          fi
          echo "========================================"

          railway status --json || true
